name: Release

# 合并进 main 后，在临时目录发布，并创建 GitHub Release。
# 版本在构建时注入，不回写仓库，也不把安装包放进项目目录。

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        shell: pwsh
        run: |
          $sha = $env:GITHUB_SHA.Substring(0, 7)
          dotnet test HostTemplate.sln -c Release --verbosity minimal `
            "-p:VersionPatch=$env:GITHUB_RUN_NUMBER" `
            "-p:SourceRevisionId=$sha"

      - name: Publish and create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $sha = $env:GITHUB_SHA.Substring(0, 7)
          $version = "1.0.$env:GITHUB_RUN_NUMBER"
          $tag = "v$version"
          $out = Join-Path $env:RUNNER_TEMP "HostTemplate-$version"
          $zip = Join-Path $env:RUNNER_TEMP "HostTemplate-$version.zip"
          $notes = Join-Path $env:RUNNER_TEMP "release-notes.md"

          if (Test-Path $out) { Remove-Item $out -Recurse -Force }
          dotnet publish src/HostTemplate.App/HostTemplate.App.csproj -c Release -o $out `
            "-p:VersionPatch=$env:GITHUB_RUN_NUMBER" `
            "-p:SourceRevisionId=$sha"

          $exe = Join-Path $out "HostTemplate.exe"
          $dll = Join-Path $out "HostTemplate.dll"
          if (-not (Test-Path $exe)) { throw "publish did not produce $exe" }

          $fileVersion = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($exe).FileVersion
          $expectedFile = "$version.0"
          Write-Host "FileVersion=$fileVersion"
          if ($fileVersion -ne $expectedFile) {
            throw "FileVersion '$fileVersion' != '$expectedFile'"
          }

          $stamp = "$version+$sha"
          $dllText = [System.Text.Encoding]::UTF8.GetString([System.IO.File]::ReadAllBytes($dll))
          if ($dllText.IndexOf($stamp) -lt 0) {
            throw "Assembly is missing InformationalVersion $stamp"
          }
          Write-Host "InformationalVersion=$stamp"

          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path $out -DestinationPath $zip

          $feedDir = Join-Path $env:RUNNER_TEMP "velopack-$version"
          if (Test-Path $feedDir) { Remove-Item $feedDir -Recurse -Force }
          & (Join-Path $env:GITHUB_WORKSPACE "scripts\pack-velopack.ps1") -Version $version -PublishDir $out -OutputDir $feedDir
          $nupkg = Get-ChildItem -Path $feedDir -Filter "*-full.nupkg" | Select-Object -First 1
          $feed = Join-Path $feedDir "releases.win.json"
          if (-not $nupkg -or -not (Test-Path $feed)) { throw "Velopack package was not produced" }

          @(
            "由推送到 main 的构建自动生成，对应提交 $sha。"
            ""
            "- 版本：$version"
            "- 文件版本：$version.0"
            "- InformationalVersion：$stamp"
            ""
            "附件："
            "- ``HostTemplate-$version.zip``：dotnet publish 的输出，只挂在这个 Release 上，不写回仓库。"
            "- ``HostTemplate-$version-full.nupkg`` 和 ``releases.win.json``：Velopack 全量包。把 nupkg 丢进更新服务的 ``data/inbox``，或 ``PUT /api/packages/$version``。服务会自己生成每个版本的 feed，不依赖共享文件夹。"
          ) | Set-Content -Path $notes -Encoding utf8

          $nativePreference = $PSNativeCommandUseErrorActionPreference
          $PSNativeCommandUseErrorActionPreference = $false
          gh release view $tag --json tagName *> $null
          $releaseExists = $LASTEXITCODE -eq 0
          $PSNativeCommandUseErrorActionPreference = $nativePreference

          if ($releaseExists) {
            gh release upload $tag $zip $nupkg.FullName $feed --clobber
            if ($LASTEXITCODE -ne 0) { throw "failed to upload release assets to $tag" }
            gh release edit $tag --notes-file $notes
            if ($LASTEXITCODE -ne 0) { throw "failed to update notes for $tag" }
          } else {
            gh release create $tag $zip $nupkg.FullName $feed --title "HostTemplate $version" --notes-file $notes --target $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) { throw "failed to create release $tag" }
          }
